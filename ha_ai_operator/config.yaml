name: "HA AI Operator - Beta"
version: "0.1.1-beta.11"
slug: "ha_ai_operator"
description: "On-device AI agent to operate Home Assistant safely"
url: "https://github.com/J-Fasterling/ha_ai_operator-beta"
arch:
  - amd64
  - aarch64
  - armv7

startup: services
boot: auto
init: false

ingress: true
ingress_port: 8099
panel_title: "HA AI Operator - Beta"
panel_icon: "mdi:robot"

host_network: false
homeassistant_api: true
# hassio_api is intentionally false by default.
# The allow_supervisor_api option controls whether the *agent* uses Supervisor
# tools at runtime via SUPERVISOR_TOKEN.  Enabling hassio_api here would grant
# the container direct Supervisor socket access, which is a separate privilege
# escalation step.  Enable it manually in config.yaml only when you understand
# the implications.
hassio_api: false

map:
  - share:rw
  - media:ro

options:
  timezone: "Europe/Berlin"
  mode: "read_only"
  llm_provider: "openai_compatible"  # openai_compatible | ollama | custom_http | anthropic
  llm_model: null
  llm_api_key: null        # Optional: API key for direct config (classic mode)
                           # Leave empty and use the Auth tab for OAuth/token management
  llm_base_url: null       # Optional: only needed for Ollama or custom LLM endpoints
  allow_supervisor_api: false
  confirmation_required: true
  max_actions_per_turn: 5
  audit_log_level: "minimal"
  app_log_level: "info"

schema:
  timezone: str
  mode: list(read_only|control_assist|ops_write)
  llm_provider: list(openai_compatible|ollama|custom_http|anthropic)
  llm_model: str?
  llm_api_key: password?
  llm_base_url: str?
  allow_supervisor_api: bool
  confirmation_required: bool
  max_actions_per_turn: int
  audit_log_level: list(minimal|verbose)
  app_log_level: list(debug|info|warning|error)
