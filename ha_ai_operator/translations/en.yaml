configuration:
  timezone:
    name: Timezone
    description: >-
      IANA timezone string used by the container (e.g. Europe/Berlin, America/New_York).
  mode:
    name: Operating Mode
    description: >-
      Controls what the AI agent is allowed to do.
      read_only: only reads data, never changes anything.
      control_assist: allows basic control (lights, media, helpers).
      ops_write: full access; medium/high-risk actions require confirmation.
  llm_provider:
    name: AI Provider
    description: >-
      Fixed to Codex. Other AI providers are not selectable in this build.
  llm_model:
    name: Codex Model
    description: >-
      Concrete Codex model name used by the add-on.
      The UI sends internal alias "ha-agent"; this alias maps to this value.
      If empty, UI requests cannot be executed because no Codex model can be selected.
  llm_oauth_token:
    name: Codex OAuth Token
    description: >-
      OAuth access token used for ChatGPT Codex OAuth.
      Stored as a password field; never logged or displayed.
      Example source (outside HA): jq -r '.tokens.access_token' ~/.codex/auth.json
  allow_supervisor_api:
    name: Allow Supervisor API Tools
    description: >-
      Expose Supervisor-level tools to the agent (host info, core info, core restart).
      Keep disabled unless you specifically need the agent to inspect or restart HA Core.
      Note: does NOT automatically enable hassio_api in the add-on manifest.
  confirmation_required:
    name: Require Confirmation for Risky Actions
    description: >-
      When true, the agent returns a plan and confirmation token for any medium or
      high-risk action instead of executing it immediately.
      Strongly recommended in ops_write mode.
  max_actions_per_turn:
    name: Max Actions per Turn
    description: >-
      Maximum number of HA tool calls the agent may make in a single response.
      Prevents runaway loops. Recommended: 5–10.
  audit_log_level:
    name: Audit Log Level
    description: >-
      minimal: log tool name, params summary, result summary, and risk level.
      verbose: reserved for future extended logging (currently identical to minimal).
  app_log_level:
    name: App Log Level
    description: >-
      Logging verbosity of the add-on backend.
      debug: most detailed diagnostics (recommended while investigating loading issues).
      info: default operational logs.
      warning/error: reduced output, only problems.
