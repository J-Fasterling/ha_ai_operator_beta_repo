configuration:
  timezone:
    name: Zeitzone
    description: >-
      IANA-Zeitzone des Containers (z.B. Europe/Berlin, America/New_York).
  mode:
    name: Betriebsmodus
    description: >-
      Legt fest, was der KI-Agent tun darf.
      read_only: liest nur Daten, ändert nichts.
      control_assist: erlaubt einfache Steuerung (Lichter, Medien, Eingabe-Helfer).
      ops_write: voller Zugriff; mittel- und hochriskante Aktionen benötigen Bestätigung.
  llm_provider:
    name: LLM-Anbieter
    description: >-
      Welches KI-Backend verwendet werden soll.
      openai_compatible: beliebiger OpenAI-kompatibler Anbieter (OpenAI, Groq, Together, OpenRouter, …).
      ollama: lokale Ollama-Instanz (Standard-URL http://localhost:11434/v1).
      custom_http: eigener OpenAI-kompatibler Endpunkt; llm_base_url entsprechend setzen.
      anthropic: Anthropic Claude-Modelle via api.anthropic.com (x-api-key-Auth, /v1/messages-Endpoint).
  openai_auth_mode:
    name: OpenAI-Auth-Modus
    description: >-
      Authentifizierungsmodus fuer OpenAI-kompatible Anfragen.
      api_key: nutzt llm_api_key als Bearer-Token (standardmaessiger OpenAI-API-Key-Flow).
      codex_oauth: nutzt llm_oauth_token als Bearer-Token (ChatGPT-Codex-OAuth-Access-Token-Flow).
      Wird fuer Anthropic ignoriert.
  llm_base_url:
    name: LLM Basis-URL
    description: >-
      Basis-URL der LLM-API, z.B. http://192.168.1.50:11434/v1 für ein lokales Ollama.
      Leer lassen, um den Provider-Standard zu verwenden (api.openai.com für openai_compatible).
  llm_api_key:
    name: LLM API-Schlüssel
    description: >-
      API-Schlüssel für den LLM-Anbieter. Wird als Passwort gespeichert und niemals geloggt.
      Leer lassen, wenn der Anbieter keine Authentifizierung benötigt (z.B. lokales Ollama).
  llm_oauth_token:
    name: LLM OAuth-Token
    description: >-
      OAuth-Access-Token, wenn openai_auth_mode auf codex_oauth steht.
      Wird als Passwort gespeichert und niemals geloggt.
      Beispielquelle (ausserhalb von HA): jq -r '.tokens.access_token' ~/.codex/auth.json
  allow_supervisor_api:
    name: Supervisor-API-Tools erlauben
    description: >-
      Stellt dem Agenten Supervisor-Tools bereit (Host-Info, Core-Info, Core-Neustart).
      Deaktiviert lassen, außer wenn der Agent HA Core prüfen oder neu starten soll.
      Aktiviert NICHT automatisch hassio_api im Add-on-Manifest.
  confirmation_required:
    name: Bestätigung für riskante Aktionen erforderlich
    description: >-
      Wenn aktiviert, gibt der Agent bei mittel- oder hochriskanten Aktionen zuerst
      einen Plan mit Bestätigungs-Token aus, anstatt sofort zu handeln.
      Im Modus ops_write dringend empfohlen.
  max_actions_per_turn:
    name: Max. Aktionen pro Antwort
    description: >-
      Maximale Anzahl von HA-Tool-Aufrufen des Agenten pro Antwort.
      Verhindert unkontrollierte Schleifen. Empfehlung: 5–10.
  audit_log_level:
    name: Audit-Log-Stufe
    description: >-
      minimal: protokolliert Tool-Name, Parameter-Zusammenfassung, Ergebnis und Risikostufe.
      verbose: reserviert für zukünftige erweiterte Protokollierung (derzeit identisch mit minimal).
